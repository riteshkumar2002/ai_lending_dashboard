<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Underwriting workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  /* ─── Tokens ──────────────────────────────────────────────── */
  :root[data-theme="light"] {
    --bg-0: oklch(0.985 0.003 240);   /* page */
    --bg-1: oklch(1 0 0);              /* card */
    --bg-2: oklch(0.97 0.004 240);     /* row hover */
    --bg-3: oklch(0.93 0.006 240);     /* hairline */
    --bg-3-strong: oklch(0.85 0.008 240);
    --bg-sel: oklch(0.955 0.018 260);
    --bg-rail: oklch(0.975 0.004 240);

    --text-1: oklch(0.22 0.014 260);
    --text-2: oklch(0.42 0.012 260);
    --text-3: oklch(0.58 0.012 260);
    --text-4: oklch(0.7 0.01 260);

    --accent: oklch(0.55 0.13 264);
    --accent-strong: oklch(0.46 0.15 264);
    --accent-faint: oklch(0.93 0.04 264);

    --c-green: oklch(0.62 0.13 152);
    --c-green-soft: oklch(0.78 0.09 152);
    --c-amber: oklch(0.74 0.13 78);
    --c-red: oklch(0.6 0.18 25);

    --shadow-card: 0 1px 0 oklch(0.94 0.005 240);
  }

  :root[data-theme="dark"] {
    --bg-0: oklch(0.17 0.01 260);
    --bg-1: oklch(0.205 0.012 260);
    --bg-2: oklch(0.235 0.014 260);
    --bg-3: oklch(0.275 0.014 260);
    --bg-3-strong: oklch(0.36 0.016 260);
    --bg-sel: oklch(0.27 0.04 264);
    --bg-rail: oklch(0.19 0.012 260);

    --text-1: oklch(0.96 0.005 260);
    --text-2: oklch(0.78 0.012 260);
    --text-3: oklch(0.62 0.014 260);
    --text-4: oklch(0.5 0.014 260);

    --accent: oklch(0.7 0.13 264);
    --accent-strong: oklch(0.78 0.14 264);
    --accent-faint: oklch(0.31 0.06 264);

    --c-green: oklch(0.74 0.14 152);
    --c-green-soft: oklch(0.62 0.12 152);
    --c-amber: oklch(0.78 0.14 78);
    --c-red: oklch(0.7 0.17 25);

    --shadow-card: 0 1px 0 oklch(0.235 0.014 260);
  }

  :root {
    --font: "Inter Tight", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", monospace;
    --r-sm: 4px;
    --r-md: 6px;
    --r-lg: 10px;

    /* ── Performance tier colors (fixed, theme-independent) ── */
    --perf-green:  #22C55E;  /* Strong   80–100% */
    --perf-yellow: #EAB308;  /* Moderate 60–79%  */
    --perf-orange: #F97316;  /* Risk     40–59%  */
    --perf-red:    #EF4444;  /* Critical  0–39%  */
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    font-feature-settings: "ss01", "cv01", "cv11";
    background: var(--bg-0);
    color: var(--text-1);
    font-size: 13px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    height: 100vh;
  }
  .mono, .tnum { font-family: var(--font-mono); font-feature-settings: "tnum"; }
  .num, table, .row-num, .hk-v, .big-num, .score-num { font-variant-numeric: tabular-nums; }
  button { font-family: inherit; cursor: pointer; }
  input, textarea { font-family: inherit; }
  ::placeholder { color: var(--text-4); }

  /* ─── App shell ───────────────────────────────────────────── */
  .app {
    display: grid;
    grid-template-columns: 56px 380px 1fr;
    height: 100vh;
    width: 100vw;
    min-width: 1280px;
  }
  .app.app-pipeline {
    grid-template-columns: 56px 1fr;
  }

  /* ─── Side rail ───────────────────────────────────────────── */
  .rail {
    background: var(--bg-rail);
    border-right: 1px solid var(--bg-3);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px 0;
    gap: 6px;
  }
  .rail-logo {
    width: 32px; height: 32px;
    border-radius: 7px;
    background: var(--text-1);
    color: var(--bg-1);
    display: grid; place-items: center;
    font-weight: 700; font-size: 14px;
    margin-bottom: 14px;
    letter-spacing: -0.02em;
  }
  .rail-btn {
    width: 36px; height: 36px;
    border-radius: var(--r-md);
    border: none;
    background: transparent;
    color: var(--text-3);
    display: grid; place-items: center;
    position: relative;
  }
  .rail-btn:hover { background: var(--bg-2); color: var(--text-1); }
  .rail-btn.active { background: var(--bg-2); color: var(--text-1); }
  .rail-btn.active::before {
    content: "";
    position: absolute; left: -14px; top: 8px; bottom: 8px;
    width: 2px; background: var(--accent); border-radius: 2px;
  }
  .rail-spacer { flex: 1; }
  .rail-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--accent-faint); color: var(--accent-strong);
    display: grid; place-items: center;
    font-size: 11px; font-weight: 600;
  }

  /* ─── List pane ───────────────────────────────────────────── */
  .list-pane {
    background: var(--bg-1);
    border-right: 1px solid var(--bg-3);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .list-header {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--bg-3);
  }
  .list-header-row {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 12px;
    gap: 12px;
  }
  .list-header-row > div:first-child { min-width: 0; flex: 1; }
  .eyebrow { white-space: nowrap; }
  .queue-meta { flex-shrink: 0; }
  .queue-meta > div { white-space: nowrap; }
  .eyebrow {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-3);
    font-weight: 500;
  }
  .list-title {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin-top: 2px;
  }
  .queue-meta {
    display: flex; gap: 14px;
    align-items: flex-end;
  }
  .queue-meta > div {
    display: flex; flex-direction: column; align-items: flex-end;
  }
  .queue-meta .num {
    font-family: var(--font-mono);
    font-feature-settings: "tnum";
    font-size: 16px; font-weight: 500;
    color: var(--text-1);
    letter-spacing: -0.02em;
  }
  .queue-meta .meta-l {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-3);
  }

  .search-row {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg-2);
    border: 1px solid var(--bg-3);
    border-radius: var(--r-md);
    padding: 6px 10px;
    color: var(--text-3);
    margin-bottom: 10px;
  }
  .search-row:focus-within {
    border-color: var(--accent);
    background: var(--bg-1);
  }
  .search-row input {
    flex: 1; border: 0; background: transparent;
    color: var(--text-1); font-size: 13px;
    outline: none;
  }
  kbd {
    font-family: var(--font-mono);
    background: var(--bg-1); border: 1px solid var(--bg-3);
    padding: 1px 5px; border-radius: 3px;
    font-size: 10px; color: var(--text-3);
  }

  .chip-row {
    display: flex; gap: 4px; flex-wrap: wrap;
  }
  .chip-row-thin { margin-top: 6px; }
  .chip {
    border: 1px solid var(--bg-3);
    background: var(--bg-1);
    color: var(--text-2);
    padding: 3px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 500;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .chip:hover { background: var(--bg-2); }
  .chip-active {
    background: var(--text-1) !important;
    color: var(--bg-1);
    border-color: var(--text-1);
  }
  .chip-thin { padding: 2px 7px; font-size: 10.5px; color: var(--text-3); }
  .chip-n {
    font-family: var(--font-mono);
    font-feature-settings: "tnum";
    color: var(--text-4);
    font-size: 10px;
  }
  .chip-active .chip-n { color: var(--bg-3); }

  .list-colhead {
    display: grid;
    grid-template-columns: 2.5fr 1fr 1fr 1.2fr;
    align-items: center;
    padding: 6px 16px;
    gap: 0;
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-3);
    border-bottom: 1px solid var(--bg-3);
  }
  .list-colhead > span:not(:first-child) {
    border-left: 1px solid rgba(255,255,255,0.06);
    padding-left: 14px;
  }

  .list-rows {
    flex: 1;
    overflow-y: auto;
  }
  .empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--text-3);
    font-size: 12px;
  }

  .row {
    width: 100%;
    background: transparent;
    border: 0;
    border-bottom: 1px solid var(--bg-3);
    text-align: left;
    padding: 0 16px;
    display: grid;
    grid-template-columns: 2.5fr 1fr 1fr 1.2fr;
    align-items: center;
    gap: 0;
    min-height: 72px;
    position: relative;
    color: inherit;
    transition: background 0.2s ease;
  }
  .row:hover { background: var(--bg-2); }
  .row-sel {
    background: var(--bg-sel) !important;
  }
  .row-stripe {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    opacity: 0;
  }
  .row-sel .row-stripe { opacity: 1; background: var(--accent) !important; }
  .row-main {
    min-width: 0;
  }
  .row-line1 {
    display: flex; align-items: center; gap: 8px;
  }
  .avatar {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--accent-faint);
    color: var(--accent-strong);
    display: grid; place-items: center;
    font-size: 10px;
    font-weight: 600;
    flex-shrink: 0;
    letter-spacing: 0.02em;
  }
  .avatar-lg {
    width: 44px; height: 44px;
    font-size: 14px;
  }
  .row-name { min-width: 0; flex: 1; }
  .row-name-text {
    font-size: 13px; font-weight: 500;
    color: var(--text-1);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row-sub {
    font-size: 10.5px;
    color: var(--text-3);
    display: flex; gap: 5px; align-items: center;
    margin-top: 1px;
  }
  .row-id { font-family: var(--font-mono); font-size: 10px; }
  .row-prod { font-family: var(--font-mono); font-size: 10px; color: var(--text-2); }
  .dot-sep { color: var(--text-4); }

  .row-line2 {
    display: flex; gap: 4px; flex-wrap: wrap;
    margin-top: 6px;
    margin-left: 34px;
  }
  .status-pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 1px 7px 1px 6px;
    border-radius: 999px;
    background: var(--bg-2);
    border: 1px solid var(--bg-3);
    font-size: 10.5px;
    color: var(--text-2);
    font-weight: 500;
  }
  .status-pill .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--pill, var(--text-3));
  }
  .status-pill-lg {
    font-size: 11.5px;
    padding: 3px 9px 3px 8px;
  }
  .status-pill-sm {
    font-size: 10px;
    padding: 0 6px 0 5px;
  }
  .flag-pill {
    font-size: 10.5px;
    padding: 1px 7px;
    border-radius: 999px;
    background: oklch(from var(--c-amber) l c h / 0.12);
    color: var(--c-amber);
    font-weight: 500;
    border: 1px solid oklch(from var(--c-amber) l c h / 0.2);
  }

  .row-num-cibil {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 3px;
  }
  .row-num-primary {
    font-family: var(--font-mono);
    font-feature-settings: "tnum";
    font-size: 13px;
    font-weight: 700;
    line-height: 1;
  }
  .row-num-secondary {
    font-family: var(--font-mono);
    font-feature-settings: "tnum";
    font-size: 10px;
    color: var(--text-4);
    line-height: 1;
  }
  .row-num-ltv {
    text-align: center;
  }
  .score {
    font-family: var(--font-mono);
    font-feature-settings: "tnum";
    font-size: 13px;
    font-weight: 600;
    width: 64px;
    text-align: right;
  }
  .score-a { color: var(--c-green); }
  .score-b { color: var(--text-1); }
  .score-c { color: var(--text-2); }
  .score-d { color: var(--c-amber); }
  .score-e { color: var(--c-red); }
  .row-num {
    font-family: var(--font-mono);
    font-feature-settings: "tnum";
    font-size: 11px;
    color: var(--text-3);
    white-space: nowrap;
    min-width: 0;
    border-left: 1px solid rgba(255,255,255,0.06);
    padding: 0 14px;
  }
  .row-num-amt { color: var(--text-1); font-weight: 500; text-align: right; }

  /* ─── Detail pane ─────────────────────────────────────────── */
  .detail-pane {
    background: var(--bg-0);
    overflow-y: auto;
    height: 100vh;
  }
  .detail-header {
    background: var(--bg-1);
    border-bottom: 1px solid var(--bg-3);
    padding: 16px 22px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    flex-wrap: nowrap;
  }
  .detail-header-l {
    display: flex; gap: 14px; align-items: flex-start;
    min-width: 0; flex: 1;
  }
  .detail-name-row {
    display: flex; align-items: center; gap: 10px;
    flex-wrap: nowrap;
    min-width: 0;
  }
  .detail-name {
    margin: 0;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.018em;
    color: var(--text-1);
    white-space: nowrap;
  }
  .status-pill { white-space: nowrap; }
  .detail-header-l { min-width: 0; }
  .detail-header-l > div { min-width: 0; }
  .detail-meta {
    margin-top: 4px;
    font-size: 11.5px;
    color: var(--text-3);
    display: flex; gap: 6px; flex-wrap: nowrap;
    align-items: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .detail-header-r {
    display: flex; gap: 18px;
    flex-shrink: 0;
  }
  .hk-stat {
    display: flex; flex-direction: column;
    align-items: flex-start;
    min-width: 78px;
    white-space: nowrap;
  }
  .hk-l {
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-3);
    margin-bottom: 2px;
  }
  .hk-v {
    font-family: var(--font-mono);
    font-feature-settings: "tnum";
    font-size: 16px;
    font-weight: 500;
    color: var(--text-1);
    letter-spacing: -0.01em;
    white-space: nowrap;
  }
  .hk-v-sm { font-family: var(--font); font-size: 13px; font-weight: 500; }
  .hk-sub {
    font-size: 10.5px;
    color: var(--text-3);
  }

  .detail-actionbar {
    background: var(--bg-1);
    border-bottom: 1px solid var(--bg-3);
    padding: 0 20px;
  }
  .action-row {
    display: flex; justify-content: space-between; align-items: center;
    height: 40px;
  }
  .action-l { display: flex; gap: 0; }
  .tab {
    border: 0; background: transparent;
    height: 40px;
    padding: 0 12px;
    font-size: 12.5px; font-weight: 500;
    color: var(--text-3);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab:hover { color: var(--text-1); }
  .tab-active {
    color: var(--text-1);
    border-bottom-color: var(--accent);
  }
  .action-r { display: flex; gap: 6px; padding: 6px 0; }
  .btn {
    border: 1px solid var(--bg-3);
    background: var(--bg-1);
    color: var(--text-1);
    padding: 6px 11px;
    border-radius: var(--r-md);
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
  }
  .btn:hover { background: var(--bg-2); }
  .btn-ghost { background: transparent; }
  .btn-primary {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .btn-primary:hover { background: var(--accent-strong); }
  .btn-sm { padding: 4px 9px; font-size: 11px; }

  /* ─── Detail grid ─────────────────────────────────────────── */
  .detail-grid {
    padding: 14px 18px 40px;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
  }
  .card { min-width: 0; }
  .card {
    background: var(--bg-1);
    border: 1px solid var(--bg-3);
    border-radius: var(--r-lg);
    overflow: hidden;
  }
  .card-span-1 { grid-column: span 1; }
  .card-span-2 { grid-column: span 2; }
  .card-span-3 { grid-column: span 3; }
  .card-span-4 { grid-column: span 4; }
  .card-head {
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--bg-3);
    display: flex; justify-content: space-between;
  }
  .card-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-1);
    letter-spacing: -0.005em;
  }
  .card-sub {
    font-size: 10.5px;
    color: var(--text-3);
    margin-top: 1px;
  }
  .card-body {
    padding: 14px;
  }

  .kv-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 11.5px; }
  .kv-row > span:first-child { color: var(--text-3); }
  .kv-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 12px;
    margin-top: 8px;
    padding-top: 10px;
    border-top: 1px dashed var(--bg-3);
  }
  .kv-grid-2 { grid-template-columns: 1fr 1fr; }
  .kv-grid > div { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .kv-grid .kv-v { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kv-k { font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 500; }
  .kv-v { font-size: 12px; color: var(--text-1); font-weight: 500; }

  /* ─── Score card ──────────────────────────────────────────── */
  .score-card {
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 18px;
  }
  .score-card-left {
    display: flex; flex-direction: column;
    align-items: flex-start;
  }
  .score-num-wrap {
    margin-top: -8px;
    padding-left: 10px;
  }
  .score-num {
    font-family: var(--font-mono);
    font-feature-settings: "tnum";
    font-size: 38px;
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  .score-band {
    font-size: 11px;
    color: var(--text-3);
    margin-top: 4px;
  }
  .score-card-right {
    flex: 1;
  }
  .factor-list {
    margin-top: 8px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .factor {
    display: grid;
    grid-template-columns: 16px 30px 1fr;
    align-items: center; gap: 8px;
    font-size: 11.5px;
  }
  .factor-mark {
    width: 14px; height: 14px;
    border-radius: 3px;
    display: grid; place-items: center;
    font-size: 11px; font-weight: 700;
    line-height: 1;
  }
  .factor-positive { background: oklch(from var(--c-green) l c h / 0.15); color: var(--c-green); }
  .factor-negative { background: oklch(from var(--c-red) l c h / 0.12); color: var(--c-red); }
  .factor-code { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-3); }
  .factor-label { color: var(--text-2); }

  /* ─── DTI panel ───────────────────────────────────────────── */
  .dti-panel { display: flex; flex-direction: column; gap: 14px; }
  .dti-row-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .dti-l { font-size: 11px; color: var(--text-2); font-weight: 500; }
  .dti-v { font-family: var(--font-mono); font-feature-settings: "tnum"; font-size: 14px; font-weight: 600; color: var(--text-1); }
  .dti-v-warn { color: var(--c-red); }
  .dti-bar {
    position: relative;
    height: 8px;
    background: var(--bg-2);
    border-radius: 4px;
    overflow: visible;
  }
  .dti-fill {
    position: absolute;
    inset: 0 auto 0 0;
    border-radius: 4px;
    transition: width 0.2s;
  }
  .dti-policy {

  /* ─── Income panel ────────────────────────────────────────── */

  .big-num {

  .src-meta { display: flex; gap: 6px; align-items: baseline; }

  /* ─── Cashflow panel ──────────────────────────────────────── */

  .cf-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
  .cf-stat { }
  .cf-l { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-3); }
  .cf-v {
    font-family: var(--font-mono);
    font-feature-settings: "tnum";
    font-size: 16px;
    font-weight: 500;
    color: var(--text-1);
  }
  .cf-v span { font-family: var(--font); font-size: 10.5px; font-weight: 400; color: var(--text-3); margin-left: 2px; }
  .cf-good { color: var(--c-green); }
  .cf-chart-wrap { display: flex; flex-direction: column; gap: 6px; }
  .cf-legend { display: flex; gap: 12px; font-size: 10.5px; color: var(--text-3); }

  .lg { width: 8px; height: 8px; display: inline-block; border-radius: 2px; }

  .lg-out { background: var(--bg-3-strong); }

  .cf-cats { padding-left: 8px; border-left: 1px dashed var(--bg-3); }

  .cf-cats-list { display: flex; flex-direction: column; gap: 6px; }
  .cf-cat { display: flex; flex-direction: column; gap: 2px; }
  .cf-cat-head { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-2); }
  .cf-cat-head .mono { font-size: 10.5px; color: var(--text-1); }

  .util-bar {
    height: 4px;
    background: var(--bg-2);

  /* ─── KYC panel ───────────────────────────────────────────── */

  .kyc-review { background: oklch(from var(--c-amber) l c h / 0.15); color: var(--c-amber); }
  .kyc-fail { background: oklch(from var(--c-red) l c h / 0.15); color: var(--c-red); }

  /* ─── Tradelines table ────────────────────────────────────── */
  .tl-summary {
    display: flex; gap: 18px; flex-wrap: wrap;

  .tl-util { display: flex; align-items: center; gap: 8px; min-width: 110px; }

  .hist { display: flex; gap: 1px; }

  /* ─── Obligations ─────────────────────────────────────────── */

  /* ─── Policy ──────────────────────────────────────────────── */
  .policy-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 16px;
  }
  .policy-row {
    display: grid;
    grid-template-columns: 16px 1fr auto;

    gap: 8px;
    font-size: 11.5px;
    padding: 4px 0;
    border-bottom: 1px solid var(--bg-3);
  }

  .policy-mark {
    width: 14px; height: 14px;

    display: grid; place-items: center;
    font-size: 9.5px; font-weight: 700;
    line-height: 1;
  }
  .policy-mark-pass { background: oklch(from var(--c-green) l c h / 0.15); color: var(--c-green); }
  .policy-mark-watch { background: oklch(from var(--c-amber) l c h / 0.15); color: var(--c-amber); }
  .policy-mark-fail { background: oklch(from var(--c-red) l c h / 0.15); color: var(--c-red); }
  .policy-rule { color: var(--text-2); }
  .policy-val { font-size: 11px; color: var(--text-1); }

  /* ─── Timeline ────────────────────────────────────────────── */
  .timeline {
    display: flex; flex-direction: column;
    gap: 4px;
    position: relative;
  }
  .timeline::before {
    content: ""; position: absolute;
    left: 4px; top: 6px; bottom: 6px;
    width: 1px; background: var(--bg-3);
  }
  .tl-item { display: grid; grid-template-columns: 14px 1fr; gap: 8px; padding: 3px 0; }
  .tl-dot {
    width: 9px; height: 9px;

  .tl-time { font-size: 10px; color: var(--text-3); }

  /* ─── Notes ───────────────────────────────────────────────── */
  .notes-panel { display: flex; flex-direction: column; gap: 8px; }
  .note { padding: 8px 10px; background: var(--bg-2); border-radius: var(--r-md); }
  .note-head { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .note-author { font-size: 11px; font-weight: 600; color: var(--text-1); }
  .note-text { font-size: 11.5px; color: var(--text-2); line-height: 1.45; }
  .notes-input textarea {
    width: 100%;
    border: 1px solid var(--bg-3);
    background: var(--bg-1);
    border-radius: var(--r-md);
    padding: 6px 8px;
    font-size: 12px;
    color: var(--text-1);
    resize: vertical;
    outline: none;
  }
  .notes-input textarea:focus { border-color: var(--accent); }
  .notes-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }

  /* ─── Approval score (composite, explainable) ─────────────── */
  .apr-panel {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 18px;
    align-items: center;
  }
  .apr-rings-wrap {
    position: relative;
    width: 270px;
    height: 270px;
    margin: 0 auto;
  }
  .apr-rings-svg {
    width: 100%; height: 100%;
    display: block;
    overflow: hidden;
  }
  .apr-rings-wrap { overflow: hidden; }
  .apr-ring-track {
    fill: none;
    stroke: var(--bg-3);
    stroke-linecap: round;
    transition: stroke 0.12s;
  }
  .apr-ring-fill {
    fill: none;
    stroke-linecap: round;
    transition: opacity 0.12s;
  }
  .apr-ring-hit {
    fill: none;
    stroke: transparent;
    cursor: pointer;
  }
  .apr-ring-knob {
    transition: transform 0.12s, r 0.12s;
    pointer-events: none;
  }
  .apr-ring-group:hover .apr-ring-track { stroke: var(--bg-3); }
  .apr-ring-group.is-open .apr-ring-knob { r: 7; }
  .apr-ring-group.is-dim .apr-ring-fill { opacity: 0.45; }

  .apr-center {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    width: 100px;
  }
  .apr-center-eyebrow {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-3);
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .apr-center-num {
    display: flex; align-items: baseline; justify-content: center;
    font-family: var(--font-mono);
    font-feature-settings: "tnum";
    line-height: 1;
    letter-spacing: -0.04em;
    margin: 3px 0 4px;
  }
  .apr-center-n { font-size: 36px; font-weight: 600; }
  .apr-center-d { font-size: 14px; font-weight: 500; color: var(--text-3); margin-left: 2px; }
  .apr-center-band {
    font-size: 10px;
    color: var(--text-2);
    font-weight: 500;
    line-height: 1.3;
  }

  .apr-legend-grid {
    margin-top: 10px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .apr-legend-chip {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center; gap: 6px;
    padding: 8px 9px;
    border: 1px solid var(--bg-3);
    border-radius: var(--r-md);
    background: var(--bg-1);
    cursor: pointer;
    text-align: left;
    color: inherit;
    transition: background 0.08s, border-color 0.08s;
    min-width: 0;
  }
  .apr-legend-chip:hover { background: var(--bg-2); }
  .apr-legend-chip.is-open {
    border-color: var(--text-3);
    background: var(--bg-2);
  }
  .apr-legend-label-row {
    display: flex; align-items: center; gap: 7px;
    min-width: 0;
  }
  .apr-legend-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .apr-legend-label {
    font-size: 11px;
    color: var(--text-1);
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .apr-legend-score {
    font-family: var(--font-mono);
    font-feature-settings: "tnum";
    font-size: 12px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .apr-legend-score-d {
    font-size: 9.5px;
    color: var(--text-3);
    font-weight: 500;
  }

  .apr-left {
    display: flex; align-items: center;
    min-width: 0;
  }
  .apr-tone-good { color: var(--c-green); }
  .apr-tone-warn { color: var(--c-amber); }
  .apr-tone-bad { color: var(--c-red); }
  .apr-tone-neutral { color: var(--text-3); }
  .apr-tone-bg-good { background: var(--c-green); }
  .apr-tone-bg-warn { background: var(--c-amber); }
  .apr-tone-bg-bad { background: var(--c-red); }
  .apr-tone-bg-neutral { background: var(--text-4); }
  .apr-band {
    margin-top: 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-1);
  }
  .apr-band-sub {
    font-size: 10.5px;
    color: var(--text-3);
    margin-top: 2px;
  }

  .apr-mid { display: flex; align-items: center; }
  .apr-comp-list {
    display: flex; flex-direction: column;
    gap: 6px;
    width: 100%;
  }
  .apr-comp {
    text-align: left;
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--r-md);
    padding: 7px 10px 8px;

    color: inherit;
    transition: background 0.08s, border-color 0.08s;

    background: var(--bg-2);
    border-color: var(--bg-3);
  }
  .apr-comp-head {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 8px;
  }
  .apr-comp-score { white-space: nowrap; flex-shrink: 0; }
  .apr-comp-label {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-1);

  .apr-comp-score {

  }
  .apr-comp-fill { height: 100%; border-radius: 2px; }
  .apr-comp-w {
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-3);
  }

  .apr-right {
    background: var(--bg-2);
    border: 1px solid var(--bg-3);
    border-radius: var(--r-md);
    padding: 12px 14px;
    display: flex; flex-direction: column;
    gap: 8px;
  }
  .apr-detail-head {
    display: flex; justify-content: space-between; align-items: baseline;
    padding-bottom: 8px;
    border-bottom: 1px dashed var(--bg-3);
  }
  .apr-detail-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-1);
    text-transform: uppercase;
    letter-spacing: 0.06em;

    font-size: 11.5px;

  }
  .apr-sub-label { color: var(--text-2); }
  .apr-sub-val { font-size: 11px; font-weight: 500; }

  /* ─── Eligibility ─────────────────────────────────────────── */
  .elig-panel {
    display: flex; flex-direction: column;
    gap: 6px;
  }
  .elig-row {
    display: grid;
    grid-template-columns: 16px 1fr;
    gap: 8px;
    align-items: flex-start;
    padding: 4px 0;
    border-bottom: 1px solid var(--bg-3);

  .elig-mark {
    width: 14px; height: 14px;
    border-radius: 3px;

    margin-top: 1px;

  .elig-mark-pass { background: oklch(from var(--c-green) l c h / 0.15); color: var(--c-green); }

  .elig-mark-fail { background: oklch(from var(--c-red) l c h / 0.15); color: var(--c-red); }

  /* ─── Ingestion dashboard ─────────────────────────────────── */
  .ing-pane {
    background: var(--bg-0);
    overflow-y: auto;
    height: 100vh;
    padding: 22px 24px 60px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .ing-hero {
    background: linear-gradient(180deg, oklch(from var(--accent) l c h / 0.10) 0%, var(--bg-1) 100%);
    border: 1px solid var(--bg-3);
    border-radius: var(--r-lg);
    padding: 18px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 18px;
  }
  .ing-hero-l { display: flex; gap: 14px; align-items: center; }
  .ing-hero-icon {
    width: 48px; height: 48px;
    border-radius: 10px;
    background: oklch(from var(--c-green) l c h / 0.18);
    color: var(--c-green);
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .ing-eyebrow {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--accent);

    white-space: nowrap; position: sticky; top: 0;
  }
  .elig-table td { padding: 9px 12px; border-bottom: 1px solid var(--bg-3); vertical-align: middle; }
  .elig-table tr:last-child td { border-bottom: none; }
  .elig-table tr:hover td { background: var(--bg-2); }
  .elig-decision {
    border-radius: var(--r-lg); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px;
  }
  .elig-decision-title { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700; margin-bottom: 4px; }
  .elig-decision-grid  { display: flex; flex-direction: column; gap: 8px; }
  .elig-decision-row   { display: grid; grid-template-columns: 180px 1fr; gap: 12px; align-items: start; }
  .elig-decision-label { font-size: 11px; color: var(--text-3); font-weight: 500; }
  .elig-decision-value { font-size: 12px; color: var(--text-1); }

  /* ─── Eligibility deviation tooltip ──────────────────────────── */
  .elig-tooltip {
    background: var(--bg-1);
    border: 1px solid var(--bg-3);
    border-radius: var(--r-md);
    padding: 10px 14px;
    max-width: 340px;
    min-width: 220px;
    font-size: 11.5px;
    line-height: 1.55;
    color: var(--text-1);
    box-shadow: 0 6px 20px oklch(0 0 0 / 0.18);
  }
  .elig-tooltip-label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.10em;
    font-weight: 700;
    margin-bottom: 5px;
  }
  .elig-tooltip-reason { color: var(--text-2); }

  /* ═══ DocumentsPanel ════════════════════════════════════════════ */
  .docp-panel { display: flex; flex-direction: column; gap: 16px; }
  .docp-summary {
    background: var(--bg-1); border: 1px solid var(--bg-3);
    border-radius: var(--r-lg); padding: 14px 16px; display: flex; flex-direction: column; gap: 12px;
  }
  .docp-chips { display: flex; gap: 20px; flex-wrap: wrap; }
  .docp-chip  { display: flex; flex-direction: column; gap: 2px; align-items: center; min-width: 44px; }
  .docp-progress-wrap { flex: 1; }
  .docp-progress-track { height: 7px; background: var(--bg-3); border-radius: 999px; overflow: hidden; }
  .docp-progress-fill  { height: 100%; border-radius: 999px; transition: width 0.4s ease; }
  .docp-group {
    background: var(--bg-1); border: 1px solid var(--bg-3); border-radius: var(--r-lg); overflow: hidden;
  }
  .docp-group-label {
    padding: 8px 14px; font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.10em; color: var(--accent);
    background: var(--bg-2); border-bottom: 1px solid var(--bg-3);
  }
  .docp-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .docp-table th {
    padding: 7px 12px; font-size: 9px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--text-3); font-weight: 500;
    background: var(--bg-1); border-bottom: 1px solid var(--bg-3);
    white-space: nowrap;
  }
  .docp-table td { padding: 9px 12px; border-bottom: 1px solid var(--bg-3); vertical-align: middle; }
  .docp-table tr:last-child td { border-bottom: none; }
  .docp-table tr:hover td { background: var(--bg-2); }

  /* ═══ ParameterGroupPanel ═══════════════════════════════════════════ */
  .pg-panel { display: flex; flex-direction: column; gap: 8px; }
  .pg-subgroup {
    background: var(--bg-1); border: 1px solid var(--bg-3);
    border-radius: var(--r-lg); overflow: hidden;
  }
  .pg-subgroup-header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; width: 100%; text-align: left;
    background: transparent; border: none; cursor: pointer; color: inherit;
    transition: background 0.08s;
  }
  .pg-subgroup-header:hover { background: var(--bg-2); }
  .pg-chevron { font-size: 8px; color: var(--text-3); transition: transform 0.15s; display: inline-block; flex-shrink: 0; }
  .pg-subgroup-label { font-size: 12px; font-weight: 600; color: var(--text-1); flex: 1; }
  .pg-row-count { font-size: 10px; color: var(--text-3); font-family: var(--font-mono); }
  .pg-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .pg-table th {
    padding: 6px 12px; font-size: 9px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--text-3); font-weight: 500;
    background: var(--bg-1); border-bottom: 1px solid var(--bg-3);
  }
  .pg-table td { padding: 8px 12px; border-bottom: 1px solid var(--bg-3); vertical-align: top; }
  .pg-table tr:last-child td { border-bottom: none; }
  .pg-table tr:hover td { background: var(--bg-2); }

  /* ═══ ScorecardPanel ════════════════════════════════════════════ */
  .sc-panel { display: flex; flex-direction: column; gap: 12px; min-height: 0; }

  /* Two-column hero layout */
  .sc-main-layout {
    display: grid; grid-template-columns: auto minmax(320px, 1fr); gap: 24px; align-items: start;
  }
  .sc-rings-col {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    flex-shrink: 0;
    position: sticky; top: 24px; align-self: flex-start;
  }
  .sc-detail-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; min-height: 0; }

  /* Ring legend below chart */
  .sc-ring-legend { display: flex; flex-direction: column; gap: 4px; width: 100%; padding: 0 8px; }
  .sc-legend-item {
    display: flex; align-items: center; gap: 7px;
    padding: 4px 8px; border-radius: 6px; border: none; background: transparent;
    cursor: pointer; color: inherit; text-align: left; transition: background 0.1s;
    width: 100%;
  }
  .sc-legend-item:hover { background: var(--bg-2); }
  .sc-legend-active { background: var(--bg-2); }
  .sc-legend-dot  { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .sc-legend-label { font-size: 11px; color: var(--text-2); }

  /* Right-side card (composite or drill-down) */
  .sc-breakdown-card {
    background: var(--bg-1); border: 1px solid var(--bg-3);
    border-radius: var(--r-lg); padding: 20px 22px; height: 520px; box-sizing: border-box;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .sc-breakdown-body {
    flex: 1; overflow-y: auto; min-height: 0; padding-right: 4px;
  }
  .sc-breakdown-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
  }
  .sc-breakdown-title {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.11em; color: var(--text-2);
  }
  .sc-breakdown-total {
    font-family: var(--font-mono); font-weight: 800; font-size: 22px; color: var(--text-1);
  }
  .sc-breakdown-max { font-size: 13px; color: var(--text-3); font-weight: 400; }
  .sc-breakdown-desc {
    font-size: 11.5px; color: var(--text-3); line-height: 1.6; margin: 0 0 16px;
  }

  /* 3×2 category grid (6 categories) */
  .sc-overview-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .sc-overview-cell {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; background: var(--bg-2); border-radius: 8px;
  }
  .sc-overview-dot   { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .sc-overview-label { flex: 1; font-size: 11.5px; color: var(--text-2); min-width: 0; }
  .sc-overview-pts   { font-family: var(--font-mono); font-size: 14px; font-weight: 700; flex-shrink: 0; }
  .sc-overview-max   { color: var(--text-3); font-weight: 400; font-size: 12px; }
  button.sc-overview-cell { font: inherit; text-align: left; }
  .sc-overview-nav { border: 1px solid transparent; transition: border-color 0.12s, background 0.12s; }
  .sc-overview-nav:hover { border-color: var(--bg-3-strong); background: var(--bg-1); }

  /* Drill-down specifics */
  .sc-cat-weight-pill {
    font-size: 9.5px; color: var(--text-3); background: var(--bg-3);
    padding: 1px 6px; border-radius: 4px; font-weight: 500;
  }
  .sc-drill-bar-row { display: flex; align-items: center; margin-bottom: 2px; }
  .sc-close-btn {
    background: none; border: none; color: var(--text-3); cursor: pointer;
    font-size: 13px; padding: 2px 6px; border-radius: 4px; line-height: 1;
    transition: color 0.1s, background 0.1s;
  }
  .sc-close-btn:hover { color: var(--text-1); background: var(--bg-2); }

  /* Progress bar */
  .sc-cat-bar-track { height: 5px; background: var(--bg-3); border-radius: 999px; overflow: hidden; }
  .sc-cat-bar-fill  { height: 100%; border-radius: 999px; }

  /* Category detail item list */
  .sc-cat-items { display: flex; flex-direction: column; gap: 2px; margin-top: 14px; overflow: visible; }
  .sc-cat-item-row {
    position: relative;
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 10px; border-radius: 6px; background: var(--bg-2);
    overflow: visible;
  }
  .sc-cat-item-row:hover { background: var(--bg-3); }
  .sc-cat-item-nav:hover { background: var(--bg-3); color: var(--accent); }
  .sc-cat-item-nav:hover .sc-cat-item-label { color: var(--accent); }
  .sc-cat-item-label { font-size: 11.5px; color: var(--text-2); flex: 1; min-width: 0; }
  .sc-cat-item-pts { font-family: var(--font-mono); font-size: 12px; font-weight: 700; flex-shrink: 0; margin-left: 12px; }

  /* Drill-down navigation */
  .sc-back-btn {
    background: transparent; border: none; color: var(--accent); font-size: 12px; font-weight: 600;
    cursor: pointer; padding: 4px 8px; border-radius: 4px; transition: background 0.1s;
    font-family: var(--font-mono); flex-shrink: 0;
  }
  .sc-back-btn:hover { background: var(--bg-3); }

  /* Level list rows */
  .sc-level-list { display: flex; flex-direction: column; gap: 3px; margin-top: 4px; }
  .sc-level-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 9px 12px 9px 10px;
    border-radius: var(--r-md); width: 100%;
    transition: background 0.13s ease;
  }
  button.sc-level-row { font: inherit; text-align: left; border: none; cursor: pointer; }
  .sc-level-row-nav { border: none; }
  .sc-level-row-left { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
  .sc-level-row-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .sc-level-row-label { font-size: 12px; font-weight: 500; color: var(--text-1); transition: color 0.13s; }
  .sc-level-row-meta { font-size: 10.5px; color: var(--text-3); }
  .sc-level-row-score { font-family: var(--font-mono); font-size: 12px; font-weight: 700; min-width: 40px; text-align: right; }
  .sc-level-row-max { color: var(--text-3); font-weight: 400; }

  /* Performance indicator helpers */
  .sc-level-score-block { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
  .sc-level-perf-label  { font-size: 8.5px; font-weight: 700; letter-spacing: 0.05em; opacity: 0.82; line-height: 1; }
  .sc-level-perf-dot    { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .sc-perf-badge        {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 9px; font-weight: 700; letter-spacing: 0.05em;
    opacity: 0.85; line-height: 1; white-space: nowrap;
  }

  /* Mini progress bar inside rows */
  .sc-level-bar-track { height: 5px; background: var(--bg-3); border-radius: 999px; overflow: hidden; }
  .sc-level-bar-fill  { height: 100%; border-radius: 999px; transition: width 0.35s ease; }

  /* Inline hover card (subcategory / parameter preview below a row) */
  .sc-hover-card {
    margin: 0 12px 4px; padding: 10px 12px;
    background: var(--bg-2); border-radius: var(--r-md);
    animation: slideDown 0.13s ease-out;
  }
  .sc-hover-card-title { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.10em; font-weight: 700; color: var(--text-3); margin-bottom: 6px; }
  .sc-hover-card-row   { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; }
  .sc-hover-card-label { font-size: 11px; color: var(--text-2); }
  .sc-hover-card-score { font-family: var(--font-mono); font-size: 11px; font-weight: 700; }

  /* Parameter card (expandable) */
  .sc-param-card {
    padding: 9px 12px 9px 10px; border-radius: var(--r-md); cursor: pointer;
    transition: background 0.13s ease;
  }
  .sc-param-card:hover { background: var(--bg-2); }

  /* Category/subcategory bar */
  .sc-drill-bar-row { display: flex; align-items: center; margin-bottom: 2px; }

  /* Hover tooltip for subcategories in composite overview */
  .sc-hover-subcategories {
    animation: slideDown 0.15s ease-out;
    pointer-events: none;
  }

  /* Hover tooltip for parameters in subcategory view */
  .sc-hover-parameters {
    animation: slideDown 0.15s ease-out;
    pointer-events: none;
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Expanded subcategory view in composite overview */
  .sc-overview-subcategory {
    position: relative;
    background: var(--bg-2); padding: 10px 10px 10px 12px; border-radius: 6px;
    margin-bottom: 8px; transition: background 0.15s;
    overflow: visible;
  }
  .sc-overview-subcategory:hover { background: var(--bg-3); }

  /* Parameter row in drill-down */
  .sc-param-row {
    position: relative;
    overflow: visible;
    background: var(--bg-2); padding: 10px 10px 10px 12px; border-radius: 6px;
    margin-bottom: 8px; transition: background 0.15s;
  }
  .sc-param-row:hover { background: var(--bg-3); }

  /* View parameters button */
  .sc-view-params-btn {
    margin-top: 14px; width: 100%; padding: 8px 14px;
    background: transparent; border: 1px solid var(--bg-3);
    border-radius: var(--r-md); color: var(--accent); font-size: 12px; font-weight: 600;
    cursor: pointer; text-align: center; transition: background 0.1s, border-color 0.1s;
    font-family: inherit;
  }
  .sc-view-params-btn:hover { background: var(--accent-faint); border-color: var(--accent); }

  /* Decision card */
  .sc-decision-card { border-radius: var(--r-lg); padding: 16px 18px; }
  .sc-decision-title { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700; margin-bottom: 10px; }
  .sc-decision-row   { display: grid; grid-template-columns: 140px 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px solid oklch(from var(--bg-3) l c h / 0.5); }
  .sc-decision-row:last-child { border-bottom: none; }

  /* ── AI Summary Card (ais-) ────────────────────────────────────── */
  .ai-badge {
    font-size: 9px; font-weight: 700; letter-spacing: 0.09em;
    color: var(--accent); background: oklch(from var(--accent) l c h / 0.10);
    border: 1px solid oklch(from var(--accent) l c h / 0.22);
    padding: 2px 7px; border-radius: 99px; flex-shrink: 0;
  }
  .ais-card {
    border-radius: var(--r-lg); overflow: hidden;
    border: 1px solid var(--bg-3);
    background: var(--bg-1);
    cursor: pointer;
    transition: border-color 0.18s, box-shadow 0.18s;
  }
  .ais-card:hover {
    border-color: oklch(from var(--accent) l c h / 0.45);
    box-shadow: 0 0 0 3px oklch(from var(--accent) l c h / 0.08);
  }
  /* top label row */
  .ais-label-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 14px 8px;
    background: var(--bg-2); border-bottom: 1px solid var(--bg-3);
  }
  .ais-label-left { display: flex; align-items: center; gap: 7px; }
  .ais-label-text { font-size: 9.5px; font-weight: 700; letter-spacing: 0.12em; color: var(--accent); }
  .ais-label-right { display: flex; align-items: center; gap: 8px; }
  .ais-open-hint { font-size: 10px; color: var(--text-3); font-style: italic; }
  /* verdict row */
  .ais-verdict-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px 10px; border-bottom: 1px solid var(--bg-3);
    border-left: 3px solid transparent;
  }
  .ais-verdict-left { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .ais-verdict-label { font-size: 13px; font-weight: 800; letter-spacing: 0.02em; }
  .ais-risk-chip {
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.1em;
    padding: 2px 8px; border-radius: 99px; border: 1px solid;
  }
  .ais-score-display { display: flex; align-items: baseline; gap: 1px; flex-shrink: 0; }
  .ais-score-num { font-size: 28px; font-weight: 900; font-family: var(--font-mono); line-height: 1; }
  .ais-score-denom { font-size: 13px; color: var(--text-3); font-family: var(--font-mono); }
  /* score bar */
  .ais-bar-wrap { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--bg-2); border-bottom: 1px solid var(--bg-3); }
  .ais-bar-track { flex: 1; height: 6px; background: var(--bg-3); border-radius: 99px; overflow: hidden; }
  .ais-bar-fill { height: 100%; border-radius: 99px; transition: width 0.6s ease; }
  .ais-bar-label { font-size: 10px; font-family: var(--font-mono); color: var(--text-3); white-space: nowrap; }
  /* metric chips */
  .ais-metrics { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--bg-3); }
  .ais-metric {
    border-radius: var(--r-md); border: 1px solid;
    padding: 8px 10px; display: flex; flex-direction: column; gap: 2px;
  }
  .ais-metric-label { font-size: 8.5px; font-weight: 700; letter-spacing: 0.1em; color: var(--text-3); text-transform: uppercase; }
  .ais-metric-value { font-size: 17px; font-weight: 800; font-family: var(--font-mono); line-height: 1.2; }
  .ais-metric-sub   { font-size: 9.5px; font-weight: 600; }
  /* findings */
  .ais-findings { padding: 11px 14px 10px; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid var(--bg-3); }
  .ais-findings-label { font-size: 8.5px; font-weight: 700; letter-spacing: 0.12em; color: var(--text-3); text-transform: uppercase; margin-bottom: 2px; }
  .ais-finding-row { display: flex; align-items: flex-start; gap: 7px; }
  .ais-finding-icon { font-size: 11px; flex-shrink: 0; margin-top: 1px; }
  .ais-finding-text { font-size: 11.5px; line-height: 1.5; }
  /* CTA */
  .ais-cta-row { padding: 10px 14px; display: flex; justify-content: center; background: var(--bg-2); }
  .ais-cta-btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 20px; border-radius: var(--r-md);
    background: oklch(from var(--accent) l c h / 0.12);
    border: 1px solid oklch(from var(--accent) l c h / 0.3);
    color: var(--accent); font-size: 12.5px; font-weight: 700; font-family: inherit;
    transition: background 0.15s, border-color 0.15s;
  }
  .ais-card:hover .ais-cta-btn {
    background: oklch(from var(--accent) l c h / 0.2);
    border-color: oklch(from var(--accent) l c h / 0.55);
  }

  /* ── AI Analyst Drawer (aid-) ──────────────────────────────────── */
  .aid-backdrop {
    position: fixed; inset: 0; background: oklch(0.1 0.01 260 / 0.55);
    z-index: 900; opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
  }
  .aid-backdrop-open { opacity: 1; pointer-events: all; }
  .aid-drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: 480px; max-width: 96vw;
    background: var(--bg-1); border-left: 1px solid var(--bg-3);
    z-index: 901; display: flex; flex-direction: column;
    transform: translateX(100%); transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
    box-shadow: -8px 0 32px oklch(0.08 0.01 260 / 0.4);
  }
  .aid-drawer-open { transform: translateX(0); }
  /* drawer header */
  .aid-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 16px; background: var(--bg-2); border-bottom: 1px solid var(--bg-3);
    flex-shrink: 0;
  }
  .aid-header-left { display: flex; align-items: center; gap: 10px; }
  .aid-icon {
    width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
    background: oklch(from var(--accent) l c h / 0.12);
    border: 1px solid oklch(from var(--accent) l c h / 0.28);
    display: flex; align-items: center; justify-content: center;
  }
  .aid-title    { font-size: 13px; font-weight: 700; color: var(--text-1); }
  .aid-subtitle { font-size: 10px; color: var(--text-3); margin-top: 1px; }
  .aid-header-right { display: flex; align-items: center; gap: 8px; }
  .aid-close-btn {
    width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--bg-3);
    background: transparent; color: var(--text-3); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.12s, color 0.12s;
  }
  .aid-close-btn:hover { background: var(--bg-3); color: var(--text-1); }
  /* messages */
  .aid-messages {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 13px;
    scroll-behavior: smooth;
  }
  .aid-msg { display: flex; gap: 9px; align-items: flex-start; }
  .aid-msg-user { flex-direction: row-reverse; }
  .aid-avatar {
    width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0; margin-top: 1px;
    background: oklch(from var(--accent) l c h / 0.12);
    border: 1px solid oklch(from var(--accent) l c h / 0.25);
    display: flex; align-items: center; justify-content: center;
  }
  .aid-bubble {
    max-width: 86%; padding: 9px 13px; border-radius: 10px;
    font-size: 12px; line-height: 1.72; color: var(--text-1);
  }
  .aid-msg-assistant .aid-bubble { background: var(--bg-2); border: 1px solid var(--bg-3); border-top-left-radius: 3px; }
  .aid-msg-user .aid-bubble {
    background: oklch(from var(--accent) l c h / 0.13);
    border: 1px solid oklch(from var(--accent) l c h / 0.22);
    border-top-right-radius: 3px; color: var(--accent);
  }
  /* thinking dots */
  .aid-bubble-thinking { display: flex; align-items: center; min-height: 28px; }
  .aid-thinking { display: flex; gap: 9px; align-items: center; }
  .aid-dots { display: flex; gap: 4px; padding: 4px 2px; }
  .aid-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--text-3);
    animation: aid-bounce 1.2s ease-in-out infinite;
  }
  .aid-dot:nth-child(2) { animation-delay: 0.2s; }
  .aid-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes aid-bounce {
    0%,60%,100% { transform: translateY(0); opacity: 0.35; }
    30% { transform: translateY(-5px); opacity: 1; }
  }
  /* suggestions */
  .aid-suggestions { padding: 0 14px 12px; display: flex; flex-wrap: wrap; gap: 6px; flex-shrink: 0; }
  .aid-chip {
    padding: 5px 11px; border-radius: 99px; border: 1px solid var(--bg-3);
    background: var(--bg-2); color: var(--text-2); font-size: 11px; cursor: pointer;
    font-family: inherit; transition: border-color 0.12s, color 0.12s, background 0.12s;
  }
  .aid-chip:hover { border-color: oklch(from var(--accent) l c h / 0.5); color: var(--accent); background: oklch(from var(--accent) l c h / 0.07); }
  /* input */
  .aid-input-row {
    display: flex; gap: 8px; padding: 11px 14px;
    border-top: 1px solid var(--bg-3); background: var(--bg-2); flex-shrink: 0;
  }
  .aid-input {
    flex: 1; padding: 8px 11px;
    background: var(--bg-1); border: 1px solid var(--bg-3);
    border-radius: var(--r-md); color: var(--text-1); font-size: 12px;
    font-family: inherit; outline: none; transition: border-color 0.12s;
  }
  .aid-input:focus { border-color: oklch(from var(--accent) l c h / 0.5); }
  .aid-input::placeholder { color: var(--text-4); }
  .aid-input:disabled { opacity: 0.5; }
  .aid-send-btn {
    padding: 8px 16px; border-radius: var(--r-md);
    background: var(--accent); color: #fff; border: none;
    font-size: 12px; font-weight: 600; font-family: inherit;
    cursor: pointer; transition: opacity 0.12s; white-space: nowrap;
  }
  .aid-send-btn:disabled { opacity: 0.38; cursor: not-allowed; }
  .aid-send-btn:not(:disabled):hover { opacity: 0.82; }
  .sc-decision-label { font-size: 10px; color: var(--text-3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
  .sc-decision-value { font-size: 12px; color: var(--text-1); }

  /* ─── Panel mode: AIAnalystDrawer rendered inline ────────────── */
  .aid-drawer-panel {
    position: relative !important;
    transform: none !important;
    width: 100% !important;
    max-width: none !important;
    box-shadow: none !important;
    border-left: none !important;
    /* Fill the flex column container completely */
    flex: 1 1 0 !important;
    min-height: 0 !important;
    top: auto !important;
    right: auto !important;
    bottom: auto !important;
  }

  /* ─── Ask AI floating action button ──────────────────────────── */
  @keyframes fab-glow {
    0%, 100% { box-shadow: 0 0 0 0 oklch(from var(--accent) l c h / 0.45), 0 6px 24px oklch(0 0 0 / 0.40); }
    50%       { box-shadow: 0 0 0 8px oklch(from var(--accent) l c h / 0.13), 0 6px 28px oklch(0 0 0 / 0.50); }
  }
  .ask-ai-fab {
    position: fixed;
    bottom: 28px;
    right: 28px;
    z-index: 850;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 11px 22px 11px 17px;
    border-radius: 999px;
    border: 1px solid oklch(from var(--accent) l c h / 0.50);
    background: linear-gradient(135deg, oklch(from var(--accent) calc(l - 0.06) c h / 0.95), oklch(from var(--accent) calc(l - 0.12) calc(c + 0.05) calc(h + 20) / 0.95));
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 0.02em;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transition: transform 0.18s ease, box-shadow 0.20s ease, background 0.18s ease, right 0.30s cubic-bezier(0.4,0,0.2,1), opacity 0.18s ease;
    animation: fab-glow 2.8s ease-in-out infinite;
  }
  .ask-ai-fab:hover {
    transform: translateY(-2px) scale(1.04);
    box-shadow: 0 0 0 10px oklch(from var(--accent) l c h / 0.10), 0 10px 32px oklch(0 0 0 / 0.48);
    animation: none;
  }
  .ask-ai-fab:active { transform: translateY(0) scale(0.98); }
  .ask-ai-fab-active {
    animation: none;
    right: calc(33.333% + 16px);
    box-shadow: 0 0 0 4px oklch(from var(--accent) l c h / 0.18), 0 6px 24px oklch(0 0 0 / 0.40);
  }
  .ask-ai-fab-active:hover {
    box-shadow: 0 0 0 10px oklch(from var(--accent) l c h / 0.12), 0 10px 32px oklch(0 0 0 / 0.48);
  }

  /* ─── Split mode: apdet-fullscreen becomes a flex ROW ─────────── */
  /* Default (no AI panel): flex column — header on top, content below */
  /* Split mode (AI open):  flex row   — left col (2/3) + AI panel (1/3) */
  .apdet-fullscreen.apdet-split-mode {
    flex-direction: row;
  }

  /* ─── Left column: wraps header + scrollable content ───────────── */
  .apdet-left-col {
    flex: 1 1 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
    transition: flex-basis 0.30s cubic-bezier(0.4,0,0.2,1),
                max-width   0.30s cubic-bezier(0.4,0,0.2,1);
  }
  /* Shrink to 2/3 when split is active */
  .apdet-split-mode .apdet-left-col {
    flex: 0 0 66.667%;
    max-width: 66.667%;
  }
  /* Content area fills remaining height inside left col */
  .apdet-left-col > .apdet-content {
    flex: 1 1 0 !important;
    min-height: 0 !important;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 24px;
  }

  /* ─── AI Assistant panel: right 1/3 ────────────────────────────── */
  .apdet-ai-panel {
    flex: 0 0 33.333%;
    width: 33.333%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-left: 1px solid var(--bg-3);
    background: var(--bg-1);
    animation: ai-panel-in 0.30s cubic-bezier(0.4,0,0.2,1) both;
  }
  @keyframes ai-panel-in {
    from { transform: translateX(100%); opacity: 0; }
    to   { transform: translateX(0);    opacity: 1; }
  }

  /* ═══ Full Screen Applicant Detail ═════════════════════════════ */
  .apdet-fullscreen {
    display: flex; flex-direction: column;
    height: 100vh; overflow: hidden;
    background: var(--bg-0);
  }
  /* ── Compact executive header — unified single surface ────────── */
  .hdr-shell {
    display: flex; flex-direction: column; flex-shrink: 0;
    position: relative; overflow: hidden;
    /* One continuous premium dark surface */
    background:
      linear-gradient(180deg, rgba(255,255,255,0.032) 0%, rgba(255,255,255,0) 55%),
      var(--bg-1);
    border-bottom: 1px solid rgba(255,255,255,0.07);
    box-shadow: 0 4px 28px oklch(0 0 0 / 0.30), 0 1px 0 rgba(255,255,255,0.04);
  }
  /* Extremely subtle top-edge highlight across the entire shell */
  .hdr-shell::before {
    content: ""; pointer-events: none;
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 70% 60% at 50% -10%, oklch(from var(--accent) l c h / 0.07) 0%, transparent 70%);
    z-index: 0;
  }
  /* Ensure children sit above pseudo-element */
  .hdr-top, .hdr-metrics-bar { position: relative; z-index: 1; }

  /* Top row: identity | NSTP | approval */
  .hdr-top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 24px; gap: 16px;
  }
  /* LEFT — identity */
  .hdr-identity {
    display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1;
  }
  .hdr-avatar {
    width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), oklch(from var(--accent) calc(l - 0.08) c h));
    color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,0.10);
    display: flex; align-items: center; justify-content: center;
    font-size: 13.5px; font-weight: 700; letter-spacing: 0.02em;
  }
  .hdr-id-block { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .hdr-name { font-size: 15px; font-weight: 700; color: var(--text-1); white-space: nowrap; }
  .hdr-id-row { display: flex; align-items: center; gap: 7px; }
  .hdr-id-badge {
    font-family: var(--font-mono); font-size: 10px; color: var(--accent);
    background: oklch(from var(--accent) l c h / 0.12);
    border: 1px solid oklch(from var(--accent) l c h / 0.22);
    padding: 1px 7px; border-radius: 5px; white-space: nowrap;
  }
  .hdr-stage-pill {
    font-size: 9px; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 700;
    color: var(--c-amber); background: oklch(from var(--c-amber) l c h / 0.11);
    border: 1px solid oklch(from var(--c-amber) l c h / 0.24);
    padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  }
  .hdr-sub-row { display: flex; align-items: center; gap: 5px; margin-top: 1px; }
  .hdr-sub-item { font-size: 10.5px; color: var(--text-3); }
  .hdr-sub-dot {
    width: 3px; height: 3px; border-radius: 50%;
    background: var(--text-4); flex-shrink: 0;
  }
  /* CENTER — NSTP authority */
  .hdr-nstp {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 0 28px; flex-shrink: 0;
    border-left:  1px solid rgba(255,255,255,0.07);
    border-right: 1px solid rgba(255,255,255,0.07);
  }
  .hdr-nstp-label {
    font-size: 8px; text-transform: uppercase; letter-spacing: 0.13em;
    color: var(--text-4); font-weight: 700;
  }
  .hdr-nstp-badge {
    font-size: 12.5px; font-weight: 700; color: var(--text-1); white-space: nowrap;
  }
  .hdr-nstp-rule {
    font-size: 9.5px; color: var(--text-3); white-space: nowrap;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
    padding: 2px 9px; border-radius: 5px;
  }
  /* RIGHT — approval */
  .hdr-approval {
    display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0;
  }
  .hdr-approval-label {
    font-size: 8px; text-transform: uppercase; letter-spacing: 0.13em;
    color: var(--text-4); font-weight: 700;
  }
  .hdr-approval-amount {
    font-size: 22px; font-weight: 800; color: var(--text-1);
    font-family: var(--font-mono); letter-spacing: -0.02em; line-height: 1;
  }
  .hdr-approval-actions { display: flex; gap: 8px; margin-top: 3px; }
  .hdr-btn {
    padding: 6px 15px; border-radius: var(--r-md);
    font-size: 11px; font-weight: 600; font-family: inherit;
    cursor: pointer; transition: background 0.12s, opacity 0.12s;
  }
  .hdr-btn-decline {
    background: rgba(235, 74, 88, 0.22);
    color: #ffffff;
    border: 1px solid rgba(235, 74, 88, 0.55);
  }
  .hdr-btn-decline:hover {
    background: rgba(235, 74, 88, 0.35);
  }
  .hdr-btn-approve {
    background: var(--c-green); color: #fff;
    border: 1px solid oklch(from var(--c-green) l c h / 0.70);
  }
  .hdr-btn-approve:hover { opacity: 0.87; }

  /* ── Metrics bar — same surface, only a whisper divider ─────── */
  .hdr-metrics-bar {
    display: flex; align-items: stretch;
    /* NO separate background — inherits the shell surface */
    border-top: 1px solid rgba(255,255,255,0.06);
    padding: 0 24px;
  }
  .hdr-metric {
    display: flex; flex-direction: column; justify-content: center;
    flex: 1; padding: 9px 0; gap: 2px; position: relative;
  }
  .hdr-metric-label {
    font-size: 8px; text-transform: uppercase; letter-spacing: 0.11em;
    color: var(--text-4); font-weight: 700;
  }
  .hdr-metric-value {
    font-size: 13.5px; font-weight: 700; color: var(--text-1); white-space: nowrap;
  }
  .hdr-metric-sub { font-size: 10px; color: var(--text-3); font-weight: 400; }
  .hdr-metric-divider {
    position: absolute; right: 0; top: 22%; bottom: 22%;
    width: 1px; background: rgba(255,255,255,0.07);
  }
  /* Documents Summary Bar */
  .doc-summary-bar {
    background: var(--bg-1); border: 1px solid var(--bg-3);
    border-radius: var(--r-lg); padding: 20px 24px 22px;
    margin-top: 24px;
  }
  .doc-summary-bar-inner {
    display: flex; flex-direction: column; gap: 10px;
  }
  .doc-summary-bar-title {
    font-size: 9px; text-transform: uppercase; letter-spacing: 0.10em;
    color: var(--text-3); font-weight: 700;
  }
  .doc-summary-bar-body {
    display: flex; align-items: center; gap: 24px;
  }
  .doc-summary-bar-chips {
    display: flex; gap: 8px; flex-shrink: 0;
  }
  .doc-summary-chip {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 8px 16px; border-radius: var(--r-md); background: var(--bg-2);
    min-width: 72px;
  }
  .doc-summary-bar-progress {
    flex: 1; display: flex; flex-direction: column; gap: 5px;
  }
  .doc-summary-progress-header {
    display: flex; justify-content: space-between; align-items: center;
  }
  .doc-summary-view-all {
    background: none; border: none; cursor: pointer; padding: 0;
    font-family: inherit; font-size: 10.5px; font-weight: 500;
    color: var(--accent); text-align: right; align-self: flex-end;
  }
  .doc-summary-view-all:hover { color: var(--accent-strong); text-decoration: underline; }

  .apdet-content {
    flex: 1; overflow-y: auto; padding: 24px;
  }

  /* Summary Grid */
  .summary-grid {
    display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px;
    align-items: start;
  }
  .summary-scorecard {
    min-width: 0; height: 560px; overflow: clip;
  }
  .summary-right {
    min-width: 0; height: 560px; overflow: clip; min-height: 0;
  }

  /* Documents Page */
  .documents-page {
    display: flex; flex-direction: column; gap: 16px;
  }
  .documents-header {
    display: flex; justify-content: space-between; align-items: center;
  }
  .documents-back-btn {
    display: flex; align-items: center; gap: 5px;
    padding: 6px 12px; border-radius: var(--r-md);
    border: 1px solid var(--bg-3); background: var(--bg-1);
    color: var(--text-2); font-size: 12px; font-weight: 500;
    cursor: pointer; transition: background 0.08s;
  }
  .documents-back-btn:hover { background: var(--bg-2); color: var(--text-1); }

  /* Unified table container — border-radius + overflow clip wrap the table */
  .documents-sections {
    background: var(--bg-1); border: 1px solid var(--bg-3);
    border-radius: var(--r-lg); overflow: hidden;
  }

  /* Single unified table — table-layout:fixed locks column widths globally */
  .doc-table {
    width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 12px;
  }
  /* Column widths — applied once via <colgroup>, respected by every row */
  .doc-col-sr       { width: 60px; }
  .doc-col-mandatory{ width: 100px; }
  .doc-col-status   { width: 140px; }
  .doc-col-date     { width: 160px; }
  .doc-col-download { width: 120px; }
  /* doc-col-name and doc-col-remarks fill remaining space equally (no width = auto) */

  /* Sticky column header row */
  .doc-th {
    padding: 9px 12px; font-size: 9px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--text-3); font-weight: 600;
    background: var(--bg-2); border-bottom: 2px solid var(--bg-3);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .doc-th-sr, .doc-th-name, .doc-th-remarks { text-align: left; }
  .doc-th-mandatory, .doc-th-status, .doc-th-date { text-align: center; }
  .doc-th-download { text-align: right; }

  /* Section group divider rows */
  .doc-section-row td {
    padding: 0; background: var(--bg-2);
    border-top: 1px solid var(--bg-3); border-bottom: 1px solid var(--bg-3);
  }
  .doc-section-row:first-child td { border-top: none; }
  .doc-section-toggle-btn {
    display: flex; align-items: center; gap: 8px;
    width: 100%; padding: 9px 16px;
    background: none; border: none; cursor: pointer; color: inherit;
  }
  .doc-section-toggle-btn:hover { background: var(--bg-3); }
  .doc-section-title {
    font-size: 10px; font-weight: 700; color: var(--text-1);
    text-transform: uppercase; letter-spacing: 0.08em; flex: 1; text-align: left;
  }
  .doc-section-count {
    font-size: 10px; color: var(--text-3); font-family: var(--font-mono);
  }
  .doc-section-chevron { color: var(--text-3); transition: transform 0.15s; flex-shrink: 0; }
  .doc-section-chevron.open { transform: rotate(180deg); }

  /* Data cells */
  .doc-td {
    padding: 10px 12px; border-bottom: 1px solid var(--bg-3);
    vertical-align: middle; color: var(--text-2); font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .doc-data-row:hover .doc-td { background: oklch(from var(--bg-2) l c h / 0.6); }
  .doc-td-sr {
    color: var(--text-3); font-family: var(--font-mono); font-size: 11px;
    text-align: left;
  }
  .doc-td-name { color: var(--text-1); font-weight: 500; white-space: normal; word-break: break-word; }
  .doc-td-mandatory { text-align: center; }
  .doc-td-status    { text-align: center; }
  .doc-td-date {
    text-align: center; font-family: var(--font-mono); font-size: 11px; color: var(--text-3);
  }
  .doc-td-remarks { color: var(--text-3); font-size: 11px; white-space: normal; word-break: break-word; }
  .doc-td-download  { text-align: right; }
  /* Remove bottom border from last data row before a section header or end of table */
  .doc-section-row td { border-bottom: 1px solid var(--bg-3); }

  /* Status badges */
  .doc-status-badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 10px; font-weight: 600; white-space: nowrap;
    border: 1px solid transparent;
  }
  .doc-status-received {
    color: var(--c-green);
    background: oklch(from var(--c-green) l c h / 0.10);
    border-color: oklch(from var(--c-green) l c h / 0.25);
  }
  .doc-status-missing {
    color: var(--c-red);
    background: oklch(from var(--c-red) l c h / 0.10);
    border-color: oklch(from var(--c-red) l c h / 0.25);
  }
  .doc-status-conditional {
    color: var(--c-amber);
    background: oklch(from var(--c-amber) l c h / 0.10);
    border-color: oklch(from var(--c-amber) l c h / 0.25);
  }
  .doc-status-not-applicable {
    color: var(--text-3); background: var(--bg-2); border-color: var(--bg-3);
  }

  .download-btn {
    padding: 4px 10px; border-radius: var(--r-sm);
    background: var(--accent); color: #fff; border: none;
    font-size: 10px; font-weight: 600; cursor: pointer;
    transition: opacity 0.1s; white-space: nowrap;
  }
  .download-btn:hover { opacity: 0.8; }

  /* Eligibility Block */
  .eligibility-block {
    background: var(--bg-1); border: 1px solid var(--bg-3);
    border-radius: var(--r-lg); padding: 20px;
    display: flex; flex-direction: column; gap: 14px;
    height: 520px; box-sizing: border-box; overflow: hidden;
  }
  .eligibility-list {
    overflow-y: auto; min-height: 0; padding-right: 2px;
  }
  .eligibility-block h3 {
    margin: 0 0 16px 0; font-size: 14px; font-weight: 600; color: var(--text-1);
    flex-shrink: 0;
  }
  .eligibility-list {
    display: flex; flex-direction: column; gap: 8px;
    overflow-y: auto; overflow-x: hidden;
    padding-right: 6px;
  }
  .eligibility-list::-webkit-scrollbar {
    width: 6px;
  }
  .eligibility-list::-webkit-scrollbar-track {
    background: transparent;
  }
  .eligibility-list::-webkit-scrollbar-thumb {
    background: var(--bg-3); border-radius: 3px;
  }
  .eligibility-list::-webkit-scrollbar-thumb:hover {
    background: var(--text-3);
  }
  .eligibility-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 12px; border-radius: var(--r-md); background: var(--bg-2);
  }
  .eligibility-name {
    font-size: 12px; color: var(--text-2);
  }
  .eligibility-status {
    font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px;
  }
  .eligibility-status.passed {
    background: oklch(from var(--c-green) l c h / 0.15);
    color: var(--c-green); border: 1px solid oklch(from var(--c-green) l c h / 0.3);
  }
  .eligibility-status.failed {
    background: oklch(from var(--c-red) l c h / 0.15);
    color: var(--c-red); border: 1px solid oklch(from var(--c-red) l c h / 0.3);
  }
  .eligibility-status.deviated {

  /* ── Collateral KV rows ──────────────────────────────────── */
  .pd-details-section { display: flex; flex-direction: column; }
  .pd-kv-row {
    display: flex; justify-content: space-between; align-items: center;
    gap: 16px; padding: 7px 0;
  }
  .pd-kv-label {
    font-size: 11px; color: var(--text-3); font-weight: 500; flex-shrink: 0;
  }
  .pd-kv-value {
    font-size: 11.5px; font-weight: 500; color: var(--text-1);

  /* ── LTV progress bar ─────────────────────────────────────── */
  .pd-bar-section { display: flex; flex-direction: column; gap: 7px; }
  .pd-bar-header {
    display: flex; justify-content: space-between; align-items: center;
  }
  .pd-bar-label {
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.1em;
    color: var(--text-4); text-transform: uppercase;
  }
  .pd-bar-value {
    font-size: 11px; font-weight: 700; font-family: var(--font-mono);
  }
  .pd-bar-track {
    position: relative; height: 6px; border-radius: 999px;
    background: var(--bg-3); overflow: visible;
  }
  .pd-bar-fill {
    height: 100%; border-radius: 999px; min-width: 2px;
  }
  .pd-bar-marker {
    position: absolute; top: -4px; bottom: -4px; width: 2px;
    background: var(--text-4); border-radius: 1px; opacity: 0.5;
    transform: translateX(-50%);

  .pd-bar-endpoints {
    display: flex; justify-content: space-between; align-items: center;
  }
  .pd-bar-endpoints > span {
    font-size: 9px; color: var(--text-4); font-family: var(--font-mono);
  }
  .pd-bar-guideline-label {
    font-size: 9px; color: var(--text-4); font-family: var(--font-mono);
    opacity: 0.7;

  /* Responsive */
  @media (max-width: 560px) {
    .pd-main-row { flex-direction: column; align-items: center; }
    .pd-val-col { width: 100%; }

  /* ═══ CollateralLegalPanel ══════════════════════════════════════ */

  }
  .cl-icon-box {

    background: oklch(from var(--accent) l c h / 0.12);
    border: 1px solid oklch(from var(--accent) l c h / 0.22);
    display: flex; align-items: center; justify-content: center;
  }
  .cl-card-title {
    font-size: 13px; font-weight: 700; color: var(--text-1); letter-spacing: -0.01em;
  }
  .cl-card-sub {
    font-size: 10px; color: var(--text-4); margin-top: 2px; letter-spacing: 0.03em;
  }
  .cl-section-badge {
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.08em;
    color: var(--text-4); background: var(--bg-2);
    border: 1px solid var(--bg-3); border-radius: 6px;
    padding: 3px 8px; white-space: nowrap; flex-shrink: 0;
  }
  .cl-rule { height: 1px; background: var(--bg-3); flex-shrink: 0; }
  .cl-body { padding: 16px 20px 20px; display: flex; flex-direction: column; }
  .cl-divider { height: 1px; background: var(--bg-3); margin: 12px 0; }
  .cl-section-label {
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.1em;
    color: var(--text-4); text-transform: uppercase; margin-bottom: 10px;
  }

  /* ── Fraud Prevention ──────────────────────────────────────── */
  .cl-fraud-section { }
  .cl-fraud-row { display: flex; gap: 10px; }
  .cl-fraud-card {
    flex: 1; border-radius: 10px; padding: 10px 13px;

  }
  .cl-fraud-title {
    font-size: 9px; font-weight: 700; letter-spacing: 0.09em;

  }
  .cl-fraud-status {
    font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 5px;
  }

  /* ── Report Processing Days ────────────────────────────────── */
  .cl-reports-section { display: flex; flex-direction: column; gap: 12px; }
  .cl-report-row { display: flex; flex-direction: column; gap: 6px; }
  .cl-report-header {
    display: flex; justify-content: space-between; align-items: center;
  }
  .cl-report-label {
    font-size: 11.5px; font-weight: 500; color: var(--text-2);
  }
  .cl-report-days {
    font-size: 12px; font-weight: 700; font-family: var(--font-mono);
  }
  .cl-bar-track {
    height: 5px; border-radius: 999px; background: var(--bg-3); overflow: hidden;
  }
  .cl-bar-fill { height: 100%; border-radius: 999px; min-width: 2px; }

  /* ── Loan Track Record ─────────────────────────────────────── */
  .cl-track-section { }
  .cl-track-row {
    display: flex; justify-content: space-between; align-items: center;
    gap: 16px; padding: 8px 0;
  }
  .cl-track-label {
    font-size: 11.5px; color: var(--text-2); font-weight: 500;
  }
  .cl-track-value {
    font-size: 18px; font-weight: 800; font-family: var(--font-mono);
    letter-spacing: -0.03em;
  }

  /* ── Legal Status Grid ─────────────────────────────────────── */
  .cl-lstatus-section { }
  .cl-lstatus-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .cl-lstatus-card {
    border-radius: 8px; padding: 9px 12px;
    border-top: 1px solid var(--bg-3);
    border-right: 1px solid var(--bg-3);
    border-bottom: 1px solid var(--bg-3);
    display: flex; flex-direction: column; gap: 5px;
  }
  .cl-lstatus-title {
    font-size: 9px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-4);
