    font-size: 13px; font-weight: 700;
  }

  /* Responsive */
  @media (max-width: 500px) {
    .cl-fraud-row { flex-direction: column; }
    .cl-lstatus-grid { grid-template-columns: 1fr; }
  }

  /* ═══ SectionNavigator — radial arc wheel ═══════════════════════ */
  /* Pulse ring — expands as a full circle from the trigger */
  @keyframes snav-ping {
    0%   { opacity: 0.50; transform: translateY(-50%) scale(1.00); }
    60%  { opacity: 0;    transform: translateY(-50%) scale(1.72); }
    100% { opacity: 0;    transform: translateY(-50%) scale(1.72); }
  }
  /* DEAD CLASS — kept to avoid parse errors if referenced elsewhere */
  .snav-dock {
    position: fixed;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    z-index: 9000;
    display: flex;
    flex-direction: row-reverse;
    align-items: center;
    pointer-events: none; /* dock itself is passthrough */
  }

  /* ── Collapsed trigger pill ──────────────────────────────────── */
  .snav-trigger {
    pointer-events: all;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 52px;
    border-radius: 10px 0 0 10px;
    background: oklch(0.22 0.02 260 / 0.88);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid oklch(0.38 0.02 260 / 0.50);
    border-right: none;
    color: var(--text-3);
    cursor: pointer;
    transition: color 0.18s, background 0.18s, box-shadow 0.18s, width 0.18s;
    box-shadow: -3px 0 18px oklch(0 0 0 / 0.28);
    outline: none;
  }
  .snav-trigger:hover {
    color: var(--accent);
    background: oklch(0.26 0.03 264 / 0.92);
    box-shadow: -4px 0 24px oklch(0 0 0 / 0.36),
                inset 0 0 0 1px oklch(from var(--accent) l c h / 0.25);
  }
  .snav-trigger:focus-visible {
    box-shadow: -4px 0 24px oklch(0 0 0 / 0.36),
                0 0 0 2px var(--accent);
  }
  .snav-trigger-hidden {
    opacity: 0;
    pointer-events: none;
  }

  /* ── Expanded panel ──────────────────────────────────────────── */
  .snav-panel {
    pointer-events: all;
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%) translateX(calc(100% + 2px)) scaleX(0.88);
    transform-origin: right center;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.22s ease, transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.22s;
    width: 230px;
    background: oklch(0.18 0.015 260 / 0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid oklch(0.38 0.02 260 / 0.45);
    border-radius: 14px;
    box-shadow: -6px 0 40px oklch(0 0 0 / 0.45),
                inset 0 1px 0 oklch(1 0 0 / 0.06);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .snav-panel-open {
    opacity: 1;
    visibility: visible;
    transform: translateY(-50%) translateX(0) scaleX(1);
  }

  /* Panel header */
  .snav-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px 10px;
    border-bottom: 1px solid oklch(0.38 0.02 260 / 0.35);
    flex-shrink: 0;
  }
  .snav-title {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    color: var(--text-3);
  }
  .snav-close {
    display: flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 6px;
    background: transparent; border: none;
    color: var(--text-4); cursor: pointer;
    transition: color 0.14s, background 0.14s;
    outline: none;
  }
  .snav-close:hover { color: var(--text-1); background: oklch(0.32 0.02 260 / 0.6); }
  .snav-close:focus-visible { box-shadow: 0 0 0 2px var(--accent); }

  /* Section list */
  .snav-list {
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow-y: auto;
    max-height: 340px;
  }
  .snav-list::-webkit-scrollbar { width: 3px; }
  .snav-list::-webkit-scrollbar-track { background: transparent; }
  .snav-list::-webkit-scrollbar-thumb { background: oklch(0.40 0.02 260 / 0.5); border-radius: 99px; }

  /* Individual nav item */
  .snav-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 7px 9px;
    border-radius: 8px;
    border: none;
    background: transparent;
    cursor: pointer;
    text-align: left;
    width: 100%;
    font-family: var(--font);
    transition: background 0.13s, box-shadow 0.13s;
    outline: none;
  }
  .snav-item:hover {
    background: oklch(0.30 0.03 264 / 0.55);
  }
  .snav-item:focus-visible {
    box-shadow: inset 0 0 0 2px oklch(from var(--accent) l c h / 0.60);
  }
  .snav-item-active {
    background: oklch(from var(--accent) l c h / 0.14) !important;
    box-shadow: inset 0 0 0 1px oklch(from var(--accent) l c h / 0.30);
  }

  .snav-item-icon {
    display: flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; border-radius: 6px; flex-shrink: 0;
    color: var(--text-4);
    transition: color 0.13s;
  }
  .snav-item:hover .snav-item-icon { color: var(--text-2); }
  .snav-item-active .snav-item-icon { color: var(--accent) !important; }

  .snav-item-label {
    flex: 1;
    font-size: 11.5px;
    font-weight: 500;
    color: var(--text-3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color 0.13s;
  }
  .snav-item:hover .snav-item-label { color: var(--text-1); }
  .snav-item-active .snav-item-label { color: var(--text-1) !important; font-weight: 600; }

  .snav-item-dot {
    width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    transition: box-shadow 0.18s;
  }

  /* Footer hint */
  .snav-footer {
    padding: 8px 14px 10px;
    font-size: 9.5px;
    color: var(--text-4);
    line-height: 1.45;
    border-top: 1px solid oklch(0.38 0.02 260 / 0.28);
    text-align: center;
    flex-shrink: 0;
  }

  /* Responsive — hide on very small screens */
  @media (max-width: 480px) {
    .snav-dock { display: none; }
  }

  /* ═══ RESPONSIVE DESIGN ══════════════════════════════════════════ */

  /* Desktop: hide mobile-only elements */
  .rail-close-btn { display: none; }
  .mob-menu-btn   { display: none; }
  .mob-backdrop   { display: none; }

  /* ══════════════════════════════════════════════════════════════════
     SPLIT-MODE LAYOUT OVERRIDES
     Applied when .apdet-split-mode is on .apdet-fullscreen
     (AI Assistant panel is open — dashboard is at ~66% width)
     Only layout / grid / sizing rules — NO color, style, or component changes
     ══════════════════════════════════════════════════════════════════ */

  /* ── 1. Top section: collapse from 2-column to stacked layout ──── */
  /*  Row 1 = Score Rings + Composite Breakdown (scorecard full-width) */
  /*  Row 2 = Eligibility Checks (full-width)                          */
  .apdet-split-mode .summary-grid {
    grid-template-columns: 1fr;   /* single column — stack rows */
    gap: 20px;
  }
  /* Remove fixed 560 px height clipping so content can breathe */
  .apdet-split-mode .summary-scorecard,
  .apdet-split-mode .summary-right {
    height: auto;
    overflow: visible;
  }

  /* ── 2. Scorecard internal: relax fixed heights, allow scrolling ── */
  /* sc-main-layout already handles Rings | Breakdown — keep it as-is  */
  /* but override the breakdown card's fixed height                     */
  .apdet-split-mode .sc-breakdown-card {
    height: auto;
    min-height: 280px;
    max-height: 500px;
  }
  .apdet-split-mode .sc-breakdown-body {
    max-height: 400px;
  }
  /* Allow breakdown column to shrink below 320 px if needed */
  .apdet-split-mode .sc-main-layout {
    grid-template-columns: auto minmax(0, 1fr);
    gap: 20px;
  }

  /* ── 3. Eligibility block: auto height, capped with scroll ──────── */
  .apdet-split-mode .eligibility-block {
    height: auto;
    max-height: 480px;
    overflow: hidden;  /* internal list already scrolls */
  }

  /* ── 4. Documents summary bar: minor spacing tweak ──────────────── */
  .apdet-split-mode .doc-summary-bar {
    margin-top: 20px;
  }

  /* ── 5. Application Parameters: 3 columns → 2 columns ───────────── */
  .apdet-split-mode .apdet-params-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }

  /* ── 6. General overflow guard for the left column ──────────────── */
  .apdet-split-mode .apdet-left-col .apdet-content {
    overflow-x: hidden;
  }
  .apdet-split-mode .apdet-params-card-wrap,
  .apdet-split-mode .sc-panel,
  .apdet-split-mode .eligibility-block {
    min-width: 0;
  }

  /* ─── Tablet 768–1024px ─────────────────────────────────────── */
  @media (max-width: 1024px) {
    html { overflow-x: hidden; }
    .app { min-width: 0 !important; width: 100%; grid-template-columns: 56px 1fr; }
    .cashflow-panel { grid-template-columns: 1fr 1fr; }
    .summary-grid { grid-template-columns: 1fr; }
    .summary-scorecard, .summary-right { height: auto; overflow: visible; }
    .sc-breakdown-card { height: auto; }
    .sc-breakdown-body { max-height: 400px; }
    /* Tablet split: 60/40 */
    .apdet-split-mode .apdet-left-col { flex: 0 0 60%; max-width: 60%; }
    .apdet-ai-panel { flex: 0 0 40%; width: 40%; }
    .ask-ai-fab.ask-ai-fab-active { right: calc(40% + 16px); }
    /* At 60% width on tablet — single column layout for all sections */
    .apdet-split-mode .summary-grid { grid-template-columns: 1fr; gap: 16px; }
    .apdet-split-mode .sc-main-layout { grid-template-columns: auto minmax(0, 1fr); gap: 16px; }
    .apdet-split-mode .apdet-params-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .apdet-split-mode .sc-breakdown-card { height: auto; max-height: 400px; }
    .apdet-split-mode .eligibility-block { max-height: 360px; }
  }

  /* ─── Mobile <768px ──────────────────────────────────────────── */
  @media (max-width: 767px) {
    /* Hard stop: nothing escapes the viewport horizontally */
    html { overflow-x: hidden; }
    body { overflow-x: hidden; overflow-y: auto; height: auto; max-width: 100vw; }
    *, *::before, *::after { box-sizing: border-box; }

    /* App shell: single column, no min-width */
    .app, .app.app-pipeline {
      grid-template-columns: 1fr;
      height: auto;
      min-height: 100dvh;
      min-width: 0;
      max-width: 100vw;
      overflow-x: hidden;
    }

    /* Rail → fixed slide-in drawer */
    .rail {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 500;
      width: 56px;
      transform: translateX(-100%);
      transition: transform 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 4px 0 28px rgba(0,0,0,0.55);
    }
    .rail.rail-open { transform: translateX(0); }

    .rail-close-btn {
      display: grid;
      width: 36px; height: 36px; place-items: center;
      border-radius: var(--r-md); border: none;
      background: transparent; color: var(--text-3);
      cursor: pointer; margin-bottom: 4px;
    }
    .rail-close-btn:hover { background: var(--bg-2); color: var(--text-1); }

    /* Backdrop */
    .mob-backdrop {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 499;
      -webkit-backdrop-filter: blur(2px);
      backdrop-filter: blur(2px);
    }
    .mob-backdrop.mob-open { display: block; }

    /* FAB hamburger */
    .mob-menu-btn {
      position: fixed;
      bottom: 22px; left: 18px;
      z-index: 498;
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 1px solid var(--bg-3);
      background: var(--bg-2);
      color: var(--text-1);
      display: grid; place-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.45);
      cursor: pointer;
    }

    /* ── Fullscreen applicant view ── */
    .apdet-fullscreen {
      height: auto; overflow-x: hidden; overflow-y: visible;
      min-height: 100dvh; max-width: 100vw;
    }

    /* ── Body: sidebar becomes horizontal top nav strip ── */
    .apdet-body {
      flex-direction: column;
      overflow: visible;
      min-width: 0;
    }
    .apdet-sidebar {
      width: 100%;
      flex-direction: row;
      overflow-x: auto;
      overflow-y: visible;
      height: auto;
      border-right: none;
      border-bottom: 1px solid var(--bg-3);
      padding: 6px 8px;
      gap: 2px;
      flex-wrap: nowrap;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      flex-shrink: 0;
    }
    .apdet-sidebar::-webkit-scrollbar { display: none; }
    .apdet-sidebar-section-label { display: none; }
    .apdet-nav-item {
      flex-shrink: 0;
      white-space: nowrap;
      padding: 7px 13px;
      font-size: 12px;
      width: auto;
      border-radius: var(--r-md);
    }
    .apdet-cibil-card { display: none; }

    /* Content area */
    .apdet-content {
      padding: 14px;
      overflow-x: hidden;
      overflow-y: auto;
      min-width: 0;
    }

    /* ── Header: stack identity / NSTP / approval vertically ── */
    .hdr-top {
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      padding: 12px 14px;
    }
    .hdr-identity { min-width: 0; margin-bottom: 10px; }
    .hdr-name { white-space: normal; font-size: 14px; }
    .hdr-nstp {
      flex-direction: column;
      align-items: flex-start;
      padding: 10px 0;
      border-left: none; border-right: none;
      border-top: 1px solid rgba(255,255,255,0.07);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      gap: 4px;
    }
    .hdr-nstp-rule {
      white-space: normal;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hdr-approval {
      align-items: flex-start;
      padding-top: 10px;
    }
    .hdr-approval-amount { font-size: 18px; }
    .hdr-approval-actions { flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .hdr-btn { padding: 6px 14px; font-size: 11px; }

    /* ── Metrics bar: horizontal scroll, items don't squish ── */
    .hdr-metrics-bar {
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0 14px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      flex-wrap: nowrap;
    }
    .hdr-metrics-bar::-webkit-scrollbar { display: none; }
    .hdr-metric {
      flex: 0 0 auto;
      min-width: 88px;
      padding: 8px 10px 8px 0;
    }
    .hdr-metric-value { font-size: 12.5px; }

    /* ── Summary grid → single column ── */
    .summary-grid { grid-template-columns: 1fr; gap: 14px; }
    .summary-scorecard, .summary-right { height: auto; overflow: visible; min-width: 0; }

    /* ── Scorecard layout stacks ── */
    .sc-main-layout { grid-template-columns: 1fr; gap: 16px; }
    .sc-rings-col { position: static; width: 100%; align-items: center; overflow: hidden; }
    /* SVG rings scale down to fit narrow screens */
    .sc-rings-col svg { max-width: 100%; height: auto; }
    .sc-breakdown-card { height: auto; overflow: visible; }
    .sc-breakdown-body { max-height: 340px; }

    /* ── Tab bar / action list scrolls ── */
    .apdet-tab-list { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .apdet-tab-list::-webkit-scrollbar { display: none; }

    /* ── Cashflow single column ── */
    .cashflow-panel { grid-template-columns: 1fr; }

    /* ── Queue list fills screen ── */
    .list-pane { min-height: 100dvh; }

    /* ── Eligibility KPI strip: 2 columns on mobile ── */
    .elig-kpi-strip { grid-template-columns: repeat(2, 1fr); }

    /* ── Documents summary bar: stack chips + progress vertically ── */
    .doc-summary-bar { padding: 14px 14px 16px; margin-top: 16px; }
    .doc-summary-bar-body { flex-direction: column; gap: 14px; }
    .doc-summary-bar-chips { flex-wrap: wrap; gap: 6px; }
    .doc-summary-chip { min-width: calc(30% - 6px); flex: 1; padding: 7px 8px; }
    /* "View All" button: always visible, full-width accent button */
    .doc-summary-view-all {
      display: block;
      width: 100%;
      text-align: center;
      padding: 9px 0;
      margin-top: 6px;
      background: oklch(from var(--accent) l c h / 0.10);
      border: 1px solid oklch(from var(--accent) l c h / 0.30) !important;
      border-radius: var(--r-md) !important;
      font-size: 12px; font-weight: 600;
      color: var(--accent);
      cursor: pointer;
    }

    /* ── docp-table (documents panel): horizontal scroll inside card ── */
    .docp-group { overflow-x: auto; }
    .docp-group::-webkit-scrollbar { height: 3px; }
    .docp-group::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 2px; }
    .docp-table { min-width: 560px; }

    /* ══ Full DocumentsView — card layout (table → cards) ══════════ */

    /* Documents page chrome */
    .documents-page { gap: 12px; }
    /* Hide the redundant in-content back button — shell header has one */
    .documents-header { display: none; }
    .documents-sections { overflow: visible; }

    /* Re-display all table elements as blocks */
    .doc-table           { display: block; width: 100%; }
    .doc-table thead     { display: none; }           /* hide column headers */
    .doc-table tbody     { display: flex; flex-direction: column; gap: 6px; }
    .doc-table colgroup  { display: none; }

    /* Section group divider row → styled header */
    .doc-section-row { display: block; margin-top: 10px; }
    .doc-section-row:first-child { margin-top: 0; }
    .doc-section-row td { display: block; padding: 0; border: none; background: transparent; }
    .doc-section-toggle-btn {
      border-radius: var(--r-md);
      background: var(--bg-2);
      border: 1px solid var(--bg-3) !important;
      padding: 10px 14px;
      margin-bottom: 4px;
    }

    /* Each document row → 2-column card */
    .doc-data-row {
      display: grid !important;
      grid-template-columns: 1fr auto;
      grid-template-rows: auto auto auto auto auto;
      gap: 3px 10px;
      background: var(--bg-1);
      border: 1px solid var(--bg-3);
      border-radius: var(--r-lg);
      padding: 12px 14px;
      box-sizing: border-box;
    }

    /* Reset all tds inside a data row */
    .doc-data-row .doc-td {
      display: block;
      padding: 0;
      border: none !important;
      overflow: visible;
      white-space: normal;
      text-overflow: unset;
      background: transparent !important;
      vertical-align: unset;
    }

    /* SR# — hidden on mobile */
    .doc-data-row .doc-td-sr { display: none !important; }

    /* Row 1: Document name — full width, prominent */
    .doc-data-row .doc-td-name {
      grid-column: 1 / -1;
      grid-row: 1;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-1);
      white-space: normal;
      word-break: break-word;
      padding-bottom: 7px;
      border-bottom: 1px solid var(--bg-3) !important;
      margin-bottom: 4px;
    }

    /* Row 2: Status (left) + Mandatory label (right) */
    .doc-data-row .doc-td-status {
      grid-column: 1;
      grid-row: 2;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .doc-data-row .doc-td-mandatory {
      grid-column: 2;
      grid-row: 2;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      text-align: right;
    }

    /* Row 3: Date received */
    .doc-data-row .doc-td-date {
      grid-column: 1 / -1;
      grid-row: 3;
      font-size: 10.5px;
      color: var(--text-3);
      font-family: var(--font-mono);
      text-align: left;
      padding-top: 2px;
    }
    .doc-data-row .doc-td-date::before {
      content: "Received: ";
      font-family: var(--font);
      font-weight: 500;
      color: var(--text-4);
    }

    /* Row 4: Remarks */
    .doc-data-row .doc-td-remarks {
      grid-column: 1 / -1;
      grid-row: 4;
      font-size: 11px;
      color: var(--text-3);
      white-space: normal;
      word-break: break-word;
    }

    /* Row 5: Download button — full width */
    .doc-data-row .doc-td-download {
      grid-column: 1 / -1;
      grid-row: 5;
      padding-top: 8px;
      border-top: 1px solid var(--bg-3) !important;
      margin-top: 4px;
      text-align: left;
    }
    .doc-data-row .download-btn {
      width: 100%;
      padding: 8px 12px;
      font-size: 12px;
      text-align: center;
      border-radius: var(--r-md);
    }

    /* ── Generic overflow guards for all cards/grids ── */
    .card, .sc-panel, .sc-breakdown-card, .apdet-params-card-wrap { min-width: 0; }
    .hdr-sub-row { flex-wrap: wrap; }

    /* Mobile: AI panel becomes fullscreen overlay, dashboard stays behind */
    .apdet-fullscreen.apdet-split-mode { flex-direction: column; }
    .apdet-split-mode .apdet-left-col { flex: 1 1 100%; max-width: 100%; }
    .apdet-ai-panel {
      position: fixed;
      inset: 0;
      z-index: 850;
      flex: none;
      width: 100%;
      animation: ai-panel-in 0.28s cubic-bezier(0.4,0,0.2,1) both;
    }
    /* Hide FAB when mobile AI panel is fullscreen (close via panel X button) */
    .ask-ai-fab.ask-ai-fab-active { display: none; }
  }

  /* ─── Small mobile <480px ────────────────────────────────────── */
  @media (max-width: 479px) {
    .hdr-top { padding: 10px 11px; }
    .hdr-name { font-size: 13px; }
    .hdr-avatar { width: 34px; height: 34px; font-size: 12px; }
    .hdr-approval-amount { font-size: 16px; }
    .apdet-content { padding: 10px; }
    .summary-grid { gap: 10px; }
    .sc-breakdown-body { max-height: 260px; }
    .hdr-metric { min-width: 78px; }
    .hdr-metric-value { font-size: 12px; }
    .apdet-nav-item { padding: 6px 10px; font-size: 11.5px; }
  }

</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="../src/components/ingestion.jsx"></script>
<script type="text/babel" src="../src/components/tweaks-panel.jsx"></script>
<!-- LAP / generic panel components -->
<script type="text/babel" src="../src/components/lap-data.jsx?v=10"></script>
<script type="text/babel" src="../src/components/eligibility.jsx?v=6"></script>
<script type="text/babel" src="../src/components/documents-panel.jsx?v=5"></script>
<script type="text/babel" src="../src/components/parameters-panel.jsx?v=3"></script>
<script type="text/babel" src="../src/components/applicant-identity.jsx?v=2"></script>
<script type="text/babel" src="../src/components/employment-business.jsx?v=1"></script>
<script type="text/babel" src="../src/components/income-financials.jsx?v=1"></script>
<script type="text/babel" src="../src/components/bureau-credit.jsx?v=1"></script>
<script type="text/babel" src="../src/components/property-details.jsx?v=1"></script>
<script type="text/babel" src="../src/components/collateral-legal.jsx?v=1"></script>
<script type="text/babel" src="../src/components/scorecard-panel.jsx?v=18"></script>
<script type="text/babel" src="../src/components/ai-assistant.jsx?v=2"></script>
<script type="text/babel" src="../src/components/section-navigator.jsx?v=3"></script>
<script type="text/babel" src="../src/components/applicant-detail.jsx?v=20"></script>
<script type="text/babel" src="../src/components/lap-list.jsx?v=4"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "dark"
}/*EDITMODE-END*/;

function SideRail({ view, setView, isOpen, onClose }) {
  const icons = [
    { k: "queue",    view: "queue",    label: "Applications",  path: "M3 6h18M3 12h18M3 18h18" },
    { k: "pipeline", view: "pipeline", label: "Data ingestion",path: "M4 7h6l2 3h8M4 12h16M4 17h10" },
    { k: "search",   path: "M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zm10 17l-5.2-5.2" },
    { k: "reports",  path: "M3 20h18M5 20V8m6 12V4m6 16v-9" },
    { k: "settings", path: "M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z" },
  ];
  return (
    <nav className={"rail" + (isOpen ? " rail-open" : "")} aria-label="Primary">
      <button className="rail-close-btn" onClick={onClose} aria-label="Close menu" title="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <path d="M18 6L6 18M6 6l12 12" />
        </svg>
      </button>
      <div className="rail-logo">U</div>
      {icons.map(i => {
        const active = i.view && i.view === view;
        return (
          <button
            key={i.k}
            className={"rail-btn" + (active ? " active" : "")}
            aria-label={i.label || i.k}
            title={i.label || i.k}
            onClick={() => { if (i.view) { setView(i.view); onClose && onClose(); } }}
          >
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
              <path d={i.path} />
            </svg>
          </button>
        );
      })}
      <div className="rail-spacer" />
      <div className="rail-avatar">SV</div>
    </nav>
  );
}

// LAP tab definitions — passed to generic ApplicantDetail
const LAP_TABS = [
  {
    id: "scorecard",
    label: "Summary",
    dataKey: "scorecard",
    Panel: null,
    iconPath: "M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z",
  },
  {
    id: "eligibility",
    label: "Eligibility",
    dataKey: "eligibility",
    Panel: null,
    iconPath: "M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z",
  },
  {
    id: "documents",
    label: "Documents",
    dataKey: "documents",
    Panel: null,
    iconPath: "M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z",
  },
  {
    id: "param_identity",
    label: "Identity",
    dataKey: "param_identity",
    section: "params",
    Panel: null,
    iconPath: "M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z",
  },
  {
    id: "param_employment",
    label: "Employment",
    dataKey: "param_employment",
    section: "params",
    Panel: null,
    iconPath: "M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z",
  },
  {
    id: "param_income",
    label: "Income",
    dataKey: "param_income",
    section: "params",
    Panel: null,
    iconPath: "M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z",
  },
  {
    id: "param_bureau",
    label: "Bureau",
    dataKey: "param_bureau",
    section: "params",
    Panel: null,
    iconPath: "M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z",
  },
  {
    id: "param_property",
    label: "Property",
    dataKey: "param_property",
    section: "params",
    Panel: null,
    iconPath: "M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6",
  },
  {
    id: "param_collateral",
    label: "Collateral",
    dataKey: "param_collateral",
    section: "params",
    Panel: null,
    iconPath: "M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z",
  },
];

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [view, setView] = React.useState("queue");
  const [railOpen, setRailOpen] = React.useState(false);

  // Application state
  const [selectedId, setSelectedId] = React.useState(null);
  const [query, setQuery] = React.useState("");

  React.useEffect(() => {
    document.documentElement.setAttribute("data-theme", tweaks.theme || "light");
  }, [tweaks.theme]);

  const apps = window.LAP_APPLICATIONS || [];
  const selected = apps.find(a => a.id === selectedId) || null;

  // Resolve Panel refs from window at render time (Babel loads scripts sequentially)
  const lapTabs = LAP_TABS.map(t => ({
    ...t,
    Panel: t.id === "param_identity"
      ? window.ApplicantIdentityPanel
      : t.id === "param_employment"
        ? window.EmploymentBusinessPanel
        : t.id === "param_income"
          ? window.IncomeFinancialsPanel
          : t.id === "param_bureau"
            ? window.BureauCreditPanel
            : t.id === "param_property"
              ? window.PropertyDetailsPanel
              : t.id === "param_collateral"
                ? window.CollateralLegalPanel
                : t.id.startsWith("param_")
          ? window.ParameterGroupPanel
          : window[t.id.charAt(0).toUpperCase() + t.id.slice(1) + "Panel"] ||
            window[{ eligibility: "EligibilityPanel", documents: "DocumentsPanel", scorecard: "ScorecardPanel" }[t.id]],
  }));

  // Grid class: 2-col for all queue views and pipeline
  const appClass = "app" + (
    view === "pipeline" || view === "queue" ? " app-pipeline" : ""
  );

  return (
    <>
      <div className={appClass}>
        <SideRail
          view={view}
          setView={v => { setView(v); if (v === "queue") setSelectedId(null); }}
          isOpen={railOpen}
          onClose={() => setRailOpen(false)}
        />

        {/* Mobile backdrop — closes rail when tapped */}
        <div
          className={"mob-backdrop" + (railOpen ? " mob-open" : "")}
          onClick={() => setRailOpen(false)}
        />

        {view === "queue" && selected && (
          <ApplicantDetail
            app={selected}
            tabs={lapTabs}
            onBack={() => setSelectedId(null)}
          />
        )}

        {view === "queue" && !selected && (
          <LapQueueList
            apps={apps}
            selectedId={selectedId}
            onSelect={setSelectedId}
            query={query}
            setQuery={setQuery}
            style={{ borderRight: 'none' }}
          />
        )}

        {view === "pipeline" && <IngestionDashboard />}
      </div>

      {/* Mobile FAB — opens rail drawer */}
      <button
        className="mob-menu-btn"
        onClick={() => setRailOpen(true)}
        aria-label="Open navigation"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <path d="M3 6h18M3 12h18M3 18h18" />
        </svg>
      </button>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Appearance">
          <TweakRadio
            label="Theme"
            value={tweaks.theme}
            options={[{ value: "light", label: "Light" }, { value: "dark", label: "Dark" }]}
            onChange={v => setTweak("theme", v)}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
