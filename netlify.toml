[build]
  command = "npm run build"
  publish = "public"

# Optional: serve the main HTML as the root route
[[redirects]]
  from = "/*"
  to = "/Underwriting Workbench.html"
  status = 200
  force = false

[headers]
  [[headers.values]]
  for = "/*"
  [headers.values.headers]
  X-Frame-Options = "DENY"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "no-referrer-when-downgrade"
